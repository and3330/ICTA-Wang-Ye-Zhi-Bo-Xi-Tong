<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no">
  <title>ICTA Webinar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --aqua: #d8f2ed;
      --teal: #07585a;
      --ink: #063f43;
      --cta: #eaf9f5;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--aqua);
      color: var(--ink);
      font-family: "Noto Sans TC", sans-serif;
    }

    .ad {
      width: 100vw;
      height: 125vw;
      min-height: 100dvh;
      max-height: 100dvh;
      position: relative;
      overflow: hidden;
      padding: 10.05vw 8.35vw 8.35vw;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 1.45vw;
      color: var(--teal);
      font-family: "Noto Sans TC", sans-serif;
      font-size: 2.48vw;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .075em;
      white-space: nowrap;
    }

    .logo-mark {
      display: inline-flex;
      align-items: flex-end;
      gap: .42vw;
      height: 2.72vw;
    }

    .logo-mark i {
      display: block;
      width: .48vw;
      background: currentColor;
      border-radius: .2vw .2vw 0 0;
    }

    .logo-mark i:nth-child(1) { height: 1.16vw; }
    .logo-mark i:nth-child(2) { height: 1.92vw; }
    .logo-mark i:nth-child(3) { height: 2.72vw; }

    .logo strong {
      font-weight: 900;
      letter-spacing: .035em;
    }

    h1 {
      margin: 25.1vw 0 0;
      max-width: 82vw;
      font-size: 13.3vw;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -.065em;
    }

    .benefit {
      margin: 4.25vw 0 0;
      font-size: 7.15vw;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -.045em;
    }

    .cta {
      margin-top: auto;
      appearance: none;
      border: 0;
      border-radius: .75vw;
      min-width: 47.8vw;
      padding: 4.05vw 6.1vw 4.35vw;
      background: var(--teal);
      color: var(--cta);
      font-family: "Noto Sans TC", sans-serif;
      font-size: 4.15vw;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .055em;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="ad" aria-label="ICTA Webinar">
    <div class="logo" aria-label="ICTA WEBINAR">
      <span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>ICTA <strong>WEBINAR</strong></span>
    </div>
    <h1>每天不到 40 元</h1>
    <p class="benefit">24 小時幫你賣</p>
    <button class="cta" type="button">立即免費試用</button>
  </main>
</body>
</html>
